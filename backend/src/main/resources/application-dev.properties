# Profil local : ne jamais l'activer en production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsitter_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration,classpath:db/dev

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.assistant.demo=true
app.jwt.secret=dev-only-secret-dev-only-secret-dev-only-secret
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
app.admin.email=admin@petsitter.test
app.admin.password=admin12345
