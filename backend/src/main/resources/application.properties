# ─────────────────────────────────────────────────────────────
# PetSitter — Adoption backend (development configuration)
# The empty database `petsitter_db` must be created manually in
# phpMyAdmin. Hibernate creates the tables on first startup.
# ─────────────────────────────────────────────────────────────
spring.application.name=petsitter-backend
server.port=8081

# MySQL through XAMPP. Override with DB_URL / DB_USERNAME / DB_PASSWORD.
# createDatabaseIfNotExist : la base est créée au premier démarrage si elle n'existe pas
# (jeu de caractères par défaut du serveur, utf8mb4 avec XAMPP).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsitter_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Swagger UI: http://localhost:8081/swagger-ui/index.html
# OpenAPI JSON: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Module Utilisateur : authentification JWT ───
# Clé de signature des jetons (32 octets minimum). À définir avec JWT_SECRET hors développement.
petsitter.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-with-JWT_SECRET-32b}
petsitter.jwt.validity-hours=${JWT_VALIDITY_HOURS:72}
# Accepte encore l'en-tête X-Demo-User-Id sans jeton (Swagger, modules non migrés).
# Mettre false pour exiger une vraie connexion partout.
petsitter.auth.allow-demo-header=${ALLOW_DEMO_HEADER:true}
# Mot de passe donné aux comptes de démonstration qui n'en ont pas (vide = désactivé).
petsitter.auth.demo-password=${DEMO_PASSWORD:Demo1234}
# Mot de passe oublié : durée du code, et écriture du code dans la console si l'e-mail ne part pas.
petsitter.auth.reset-code-validity-minutes=15
petsitter.auth.log-reset-codes=${LOG_RESET_CODES:true}
# ─── E-mail (code de mot de passe oublié) ───
# Sans serveur SMTP, le code est seulement écrit dans la console du backend.
# Pour un vrai envoi : copier backend/mail.properties.example en backend/mail.properties
# (fichier ignoré par git, jamais commité) et y mettre son compte d'envoi.
spring.config.import=optional:file:./mail.properties,optional:file:./backend/mail.properties
# L'expéditeur est par défaut le compte SMTP lui-même (Gmail refuse une autre adresse).
petsitter.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@petsitter.tn}}
# Un serveur SMTP lent ou injoignable ne doit pas bloquer la demande plus de quelques secondes.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Local Python matcher (FastAPI). CRUD stays up if this host is down.
petsitter.ai.python-url=${AI_PYTHON_URL:http://localhost:8000}
petsitter.ai.connect-timeout-ms=800
petsitter.ai.read-timeout-ms=60000
# Events AI Assistant URL (FastAPI)
events.ai.url=${EVENTS_AI_URL:http://localhost:8001}
events.ai.connect-timeout-ms=2000
events.ai.read-timeout-ms=20000
# Assistant IA de la messagerie (FastAPI messaging_ai). Si le service est arrêté,
# des règles locales répondent : la messagerie continue de fonctionner.
messaging.ai.url=${MESSAGING_AI_URL:http://localhost:8002}
messaging.ai.connect-timeout-ms=800
messaging.ai.read-timeout-ms=6000
