# ─────────────────────────────────────────────────────────────
# PetSitter — Adoption backend (development configuration)
# The empty database `petsitter_db` must be created manually in
# phpMyAdmin. Hibernate creates the tables on first startup.
# ─────────────────────────────────────────────────────────────
spring.application.name=petsitter-backend
server.port=8081

# MySQL through XAMPP. Override with DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsitter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Swagger UI: http://localhost:8081/swagger-ui/index.html
# OpenAPI JSON: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Local Python matcher (FastAPI). CRUD stays up if this host is down.
petsitter.ai.python-url=${AI_PYTHON_URL:http://localhost:8000}
petsitter.ai.connect-timeout-ms=800
petsitter.ai.read-timeout-ms=60000
# Events AI Assistant URL (FastAPI)
events.ai.url=${EVENTS_AI_URL:http://localhost:8001}
events.ai.connect-timeout-ms=2000
events.ai.read-timeout-ms=20000

