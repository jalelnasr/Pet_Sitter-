spring.application.name=lamma-pets-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le schéma appartient à Flyway ; Hibernate vérifie seulement qu'il correspond aux entités.
spring.jpa.hibernate.ddl-auto=validate
# Base partagée déjà remplie : Flyway y ajoute ses tables sans toucher aux autres.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Photos des produits : le dossier se trouve sur le serveur et n'est pas versionné.
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=${JWT_SECRET}
app.jwt.validity-hours=24
# Origines autorisées (Flutter web), séparées par des virgules.
app.cors.allowed-origin-patterns=${CORS_ORIGINS:}
# Compte admin créé au démarrage s'il n'existe pas. Vide = aucun.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
